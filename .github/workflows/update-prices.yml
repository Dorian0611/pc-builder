name: Update prices

on:
  schedule:
    - cron: '30 1 1,15 * *' # twice a month: the 1st and 15th, 01:30 UTC (02:30 / 03:30 Budapest)
  workflow_dispatch:
    inputs:
      sources:
        description: 'Shops to run, as a JSON list'
        default: '["manual","pcx"]'
      max_pages:
        description: 'Max product/listing pages per shop (empty = no limit) – for quick tests'
        default: ''
      dry_run:
        description: 'Only collect and log, do not update the prices'
        type: boolean
        default: false

permissions:
  contents: write # commit the new prices
  actions: write  # trigger the deploy workflow

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  # One job per shop, in parallel, each with its own 6-hour limit.
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(inputs.sources || '["manual","pcx"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Collect ${{ matrix.source }}
        run: node scripts/prices/collect.mjs --source ${{ matrix.source }} --out offers/${{ matrix.source }}.json
        env:
          MAX_PAGES: ${{ inputs.max_pages }}
          # Off switches without a code change: Settings → Secrets and variables → Actions → Variables
          PCX_DISABLED: ${{ vars.PCX_DISABLED }}
      # also after a failure: collect.mjs writes whatever it got before the problem
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: offers-${{ matrix.source }}
          path: offers/${{ matrix.source }}.json
          if-no-files-found: ignore
          retention-days: 7

  # Merge all shops' offers into prices.json, commit, deploy.
  aggregate:
    needs: collect
    if: always() && needs.collect.result != 'cancelled' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # the latest main, not the commit that started this (long) run
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: offers-*
          path: offers
          merge-multiple: true

      # Computed on top of the newest main; if someone pushed in the meantime,
      # start again from their commit instead of fighting a merge conflict.
      - name: Compute and commit prices
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          changed=false
          for attempt in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            status=0
            node scripts/prices/update-prices.mjs --offers-dir offers || status=$?
            git add public/data/prices.json data
            if git diff --cached --quiet; then
              echo "No price changes."
              break
            fi
            git commit -q -m "Update prices $(date -u +%F)"
            if git push -q origin HEAD:main; then
              changed=true
              break
            fi
            echo "Push rejected (main moved), recomputing on the new main…"
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start the deploy explicitly.
      - name: Deploy
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}

      # A failed or missing shop makes the run red → GitHub e-mails the repo owner.
      - name: Report failed shops
        if: steps.commit.outputs.status != '0'
        run: |
          echo "::error::One or more shops failed – see the 'Compute and commit prices' log"
          exit 1
